##software como balanceo de cargar metrica consul,traekif, metrica para ver estado de contenedores
services:

  # =========================================================
  # CONSUL
  # =========================================================
  consul:
    image: ${CONSUL_IMAGE}
    container_name: sisve-consul
    restart: unless-stopped

    command:
      - agent
      - -dev
      - -ui
      - -client=0.0.0.0
      - -node=sisve-consul

    ports:
      - "${CONSUL_HTTP_HOST_PORT}:8500"
      - "${CONSUL_DNS_HOST_PORT}:8600/udp"

    healthcheck:
      test:
        - CMD
        - consul
        - members
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - sisve-network


  # =========================================================
  # TRAEFIK
  # Enruta hacia los servicios quarkusDev de Windows.
  # =========================================================
  traefik:
    image: ${TRAEFIK_IMAGE}
    container_name: sisve-plan.txt
    restart: unless-stopped

    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --ping=true
      - --entrypoints.web.address=:80
      - --providers.file.directory=/etc/plan.txt/dynamic
      - --providers.file.watch=true
      - --accesslog=true
      - --log.level=INFO

    ports:
      - "${TRAEFIK_HTTP_HOST_PORT}:80"
      - "${TRAEFIK_DASHBOARD_HOST_PORT}:8080"

    volumes:
      - ./config/plan.txt/dynamic:/etc/plan.txt/dynamic:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        - CMD
        - plan.txt
        - healthcheck
        - --ping
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - sisve-network


  # =========================================================
  # PROMETHEUS
  # =========================================================
  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: sisve-prometheus
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

    ports:
      - "${PROMETHEUS_HOST_PORT}:9090"

    volumes:
      - ./config/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - sisve-network


  # =========================================================
  # GRAFANA
  # =========================================================
  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: sisve-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"

    ports:
      - "${GRAFANA_HOST_PORT}:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      - prometheus

    networks:
      - sisve-network


volumes:
  prometheus_data:
    name: sisve-prometheus-data

  grafana_data:
    name: sisve-grafana-data


networks:
  sisve-network:
    external: true
    name: ${SISVE_NETWORK_NAME}

  #crear al red interna
  #docker network create sisve-network
