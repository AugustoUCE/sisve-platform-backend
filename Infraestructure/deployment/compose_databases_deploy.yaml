services:

  # =========================================================
  # AUTH DATABASE
  # =========================================================
  auth-db:
    image: ${POSTGRES_IMAGE}
    container_name: sisve-auth-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USERNAME}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"

    ports:
      - "${AUTH_DB_HOST_PORT}:5432"

    volumes:
      - auth_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - sisve-network


  auth-postgres-exporter:
    image: ${POSTGRES_EXPORTER_IMAGE}
    container_name: sisve-auth-postgres-exporter
    restart: unless-stopped

    environment:
      DATA_SOURCE_NAME: "postgresql://${AUTH_DB_USERNAME}:${AUTH_DB_PASSWORD}@auth-db:5432/${AUTH_DB_NAME}?sslmode=disable"

    ports:
      - "${AUTH_EXPORTER_HOST_PORT}:9187"

    depends_on:
      auth-db:
        condition: service_healthy

    networks:
      - sisve-network


