http:

  # =========================================================
  # ROUTERS
  # =========================================================
  routers:

    auth-router:
      rule: "PathPrefix(`/auth`)"
      entryPoints:
        - web
      service: auth-local

    election-router:
      rule: "PathPrefix(`/elecciones`) || PathPrefix(`/cargos`)"
      entryPoints:
        - web
      service: election-local

    vote-router:
      rule: "PathPrefix(`/votos`)"
      entryPoints:
        - web
      service: vote-local

    audit-router:
      rule: "PathPrefix(`/auditoria`)"
      entryPoints:
        - web
      service: audit-local


  # =========================================================
  # SERVICIOS QUARKUS EJECUTADOS CON QUARKUSDEV
  # =========================================================
  services:

    auth-local:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8081"

    election-local:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8082"

    vote-local:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8083"

    audit-local:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8084"