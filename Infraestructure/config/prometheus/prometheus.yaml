global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Prometheus
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # Microservicios ejecutados con quarkusDev en Windows
  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8081

  - job_name: election-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8082

  - job_name: vote-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8083

  - job_name: audit-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8084

  # PostgreSQL Exporters
  - job_name: auth-postgresql
    static_configs:
      - targets:
          - auth-postgres-exporter:9187

  - job_name: audit-postgresql
    static_configs:
      - targets:
          - audit-postgres-exporter:9187

  - job_name: election-postgresql
    static_configs:
      - targets:
          - election-postgres-exporter:9187

  - job_name: vote-postgresql
    static_configs:
      - targets:
          - vote-postgres-exporter:9187