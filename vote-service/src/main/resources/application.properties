# ============================================================
# DATASOURCE - POSTGRESQL
# ============================================================

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}

%dev.quarkus.datasource.devservices.enabled=false


# ============================================================
# FLYWAY
# ============================================================

quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=vote_schema
quarkus.flyway.default-schema=vote_schema
quarkus.flyway.baseline-on-migrate=true


# ============================================================
# HIBERNATE ORM
# Flyway administra el esquema y Hibernate lo valida
# ============================================================

quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.database.default-schema=vote_schema


# ============================================================
# HTTP
# ============================================================

quarkus.http.port=${QUARKUS_HTTP_PORT:8083}
quarkus.http.cors=true
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin
quarkus.http.cors.exposed-headers=location,authorization
quarkus.http.cors.access-control-allow-credentials=true

# Permite que Consul, ejecutado en Docker, alcance Vote
%dev.quarkus.http.host=0.0.0.0


# ============================================================
# JWT
# Vote solamente valida tokens firmados por Auth
# ============================================================

mp.jwt.verify.issuer=sisve-auth

%dev.mp.jwt.verify.publickey.location=publicKey.pem

# Configuraci�n futura de producci�n
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}


# ============================================================
# REST CLIENTS
# En desarrollo los microservicios se ejecutan localmente
# ============================================================

quarkus.rest-client.auth-service.url=${AUTH_SERVICE_URL}
quarkus.rest-client.election-service.url=${ELECTION_SERVICE_URL}
quarkus.rest-client.audit-service.url=${AUDIT_SERVICE_URL}
quarkus.rest-client.polling-station-service.url=${POLLING_STATION_SERVICE_URL}


# ============================================================
# CONSUL
# ============================================================

# Vote en Windows se comunica con Consul mediante localhost
consul.host=${CONSUL_HOST:localhost}
consul.port=${CONSUL_PORT:8500}

# Consul en Docker se comunica con Vote mediante esta direcci�n
service.discovery.address=${SERVICE_DISCOVERY_ADDRESS:host.docker.internal}


# ============================================================
# HEALTH
# ============================================================

quarkus.smallrye-health.root-path=/health

# Estas rutas son relativas a /health
quarkus.smallrye-health.liveness-path=live
quarkus.smallrye-health.readiness-path=ready


# ============================================================
# METRICS
# ============================================================

quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics


# ============================================================
# OPENAPI - SWAGGER UI
# ============================================================

quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.persist-authorization=true

quarkus.smallrye-openapi.info-title=SISVE Vote Service API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API para el registro seguro de votos electr�nicos


# ============================================================
# APPLICATION
# ============================================================

quarkus.application.name=vote-service
quarkus.application.version=1.0.0


